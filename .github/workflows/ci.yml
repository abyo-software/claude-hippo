name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      - name: audit
        run: cargo audit

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Pre-fetch the ONNX model so the integration test in tests/mcp_stdio.rs
      # finds the cache and runs the full pipeline. The fastembed crate
      # populates ~/.cache/claude-hippo/models/<model>/ on first call;
      # mcp-memory-service-rs uses a different cache path that the test
      # checks as the "skip if absent" sentinel — we plant a marker there.
      - name: pre-cache MiniLM model
        shell: bash
        run: |
          set -eux
          mkdir -p ~/.cache/mcp_memory/onnx_models/all-MiniLM-L6-v2/onnx
          # marker file: integration test only checks existence, not content
          echo "ci-marker" > ~/.cache/mcp_memory/onnx_models/all-MiniLM-L6-v2/onnx/model.onnx
          # real model goes into ~/.cache/claude-hippo/models/ via fastembed download
          mkdir -p ~/.cache/claude-hippo/models

      - name: cargo test --lib (unit)
        run: cargo test --lib --release

      - name: cargo test (eval — MockEmbedder, no model needed)
        run: |
          cargo test --release --test eval_a_long_session
          cargo test --release --test eval_b_cross_session
          cargo test --release --test eval_c_decision_trace

      - name: upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.os }}
          path: target/eval_results/*.json
          if-no-files-found: warn

      - name: build release binary
        run: cargo build --release --bin hippo

      - name: cargo test (integration, will download model on first run)
        env:
          RUST_TEST_HEAVY: "1"
        run: cargo test --release --test mcp_stdio

  bench-self:
    name: self-bench (informational)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-cache marker
        shell: bash
        run: |
          mkdir -p ~/.cache/mcp_memory/onnx_models/all-MiniLM-L6-v2/onnx
          echo "ci-marker" > ~/.cache/mcp_memory/onnx_models/all-MiniLM-L6-v2/onnx/model.onnx
          mkdir -p ~/.cache/claude-hippo/models
      - run: cargo build --release --bin hippo
      - name: hippo bench --n 100
        run: ./target/release/hippo bench --n 100

  publish-dryrun:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --allow-dirty
